<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <main class="container">
      <header class="site-nav panel">
        <a class="brand" href="{{ '/index.html' | relative_url }}" aria-label="Lukas Linauer home">
          <span class="brand-mark" aria-hidden="true">LL</span>
          <span class="brand-copy">
            <span class="brand-name">Lukas Linauer</span>
            <span class="brand-tag">Projects, notes, and experiments</span>
          </span>
        </a>
        <nav class="nav-links" aria-label="Primary">
          <a class="nav-link{% if page.nav == 'home' %} active{% endif %}" href="{{ '/index.html' | relative_url }}">Home</a>
          <a class="nav-link{% if page.nav == 'projects' %} active{% endif %}" href="{{ '/projects.html' | relative_url }}">Projects</a>
          <a class="nav-link{% if page.nav == 'blog' %} active{% endif %}" href="{{ '/blog.html' | relative_url }}">Blog</a>
        </nav>
      </header>

      {{ content }}
    </main>
  </body>
</html>
