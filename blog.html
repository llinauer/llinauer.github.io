<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Lukas Linauer</title>
    <meta name="description" content="Blog of Lukas Linauer" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <main class="container">
      <header class="site-nav panel">
        <a class="brand" href="index.html" aria-label="Lukas Linauer home">
          <span class="brand-mark" aria-hidden="true">LL</span>
          <span class="brand-copy">
            <span class="brand-name">Lukas Linauer</span>
            <span class="brand-tag">Projects, notes, and experiments</span>
          </span>
        </a>
        <nav class="nav-links" aria-label="Primary">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="projects.html">Projects</a>
          <a class="nav-link active" href="blog.html">Blog</a>
        </nav>
      </header>

      <section class="panel about">
        <div>
          <p class="eyebrow">BLOG</p>
          <h1>Notes, experiments, and writeups</h1>
          <p>
            A separate home for articles, ordered newest first.
          </p>
        </div>
      </section>

      <section class="panel repos">
        <div class="repos-head">
          <p class="eyebrow">ARTICLES</p>
          <h2>All posts</h2>
          <p class="hint">
            Latest posts appear first.
          </p>
        </div>

        <div id="blog-posts" class="post-list"></div>
      </section>
    </main>

    <script>
      const BLOG_POSTS = [
        {
          title: 'Internalizing the F1 metric',
          href: 'blog/internalizing-the-f1-metric.html',
          date: '2026-06-19',
          status: 'Draft',
          excerpt: 'An empty draft page is in place and ready for the actual writeup.'
        }
      ];

      function formatDate(dateString) {
        return new Date(`${dateString}T00:00:00Z`).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      function renderPostCard(post) {
        return `
          <article class="post-card">
            <p class="post-date">${formatDate(post.date)} · ${post.status}</p>
            <h3><a class="post-link" href="${post.href}">${post.title}</a></h3>
            <p>${post.excerpt}</p>
          </article>
        `;
      }

      function loadPosts() {
        const container = document.getElementById('blog-posts');
        const ordered = [...BLOG_POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));
        container.innerHTML = ordered.map(renderPostCard).join('');
      }

      loadPosts();
    </script>
  </body>
</html>
